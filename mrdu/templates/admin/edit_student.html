{% extends "admin/base_admin.html" %}
{% block page_title %}Edit Student{% endblock %}
{% block content %}

<div class="page-header">
  <div><h2>Edit Student</h2><p>Update details for {{ student.user.full_name }}</p></div>
  <a href="{{ url_for('admin.view_student', sid=student.id) }}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<form method="POST">
  <div class="grid-2">
    <div>
      <div class="card mb-3">
        <div class="card-header"><h3><i class="fas fa-user" style="color:var(--primary);margin-right:8px"></i>Account Info</h3></div>
        <div class="card-body">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" name="full_name" class="form-control" value="{{ student.user.full_name }}" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email *</label>
              <input type="email" name="email" class="form-control" value="{{ student.user.email }}" required>
            </div>
            <div class="form-group">
              <label class="form-label">Phone</label>
              <input type="tel" name="phone" class="form-control" value="{{ student.phone or '' }}">
            </div>
            <div class="form-group">
              <label class="form-label">Blood Group</label>
              <select name="blood_group" class="form-control form-select">
                {% for bg in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}
                <option {{ 'selected' if student.blood_group == bg }}>{{ bg }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Date of Birth</label>
              <input type="date" name="dob" class="form-control" value="{{ student.date_of_birth.strftime('%Y-%m-%d') if student.date_of_birth else '' }}">
            </div>
            <div class="form-group" style="grid-column:1/-1">
              <label class="form-label">Address</label>
              <textarea name="address" class="form-control" rows="2">{{ student.address or '' }}</textarea>
            </div>
            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" name="city" class="form-control" value="{{ student.city or '' }}">
            </div>
            <div class="form-group">
              <label class="form-label">State</label>
              <input type="text" name="state" class="form-control" value="{{ student.state or 'Telangana' }}">
            </div>
            <div class="form-group">
              <label class="form-label">Pincode</label>
              <input type="text" name="pincode" class="form-control" value="{{ student.pincode or '' }}">
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3><i class="fas fa-users" style="color:var(--primary);margin-right:8px"></i>Parent / Guardian</h3></div>
        <div class="card-body">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Parent Name</label>
              <input type="text" name="parent_name" class="form-control" value="{{ student.parent_name or '' }}">
            </div>
            <div class="form-group">
              <label class="form-label">Relation</label>
              <select name="parent_relation" class="form-control form-select">
                <option value="">Select</option>
                {% for r in ['Father','Mother','Guardian'] %}
                <option {{ 'selected' if student.parent_relation == r }}>{{ r }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Parent Phone</label>
              <input type="tel" name="parent_phone" class="form-control" value="{{ student.parent_phone or '' }}">
            </div>
            <div class="form-group">
              <label class="form-label">Parent Email</label>
              <input type="email" name="parent_email" class="form-control" value="{{ student.parent_email or '' }}">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="card mb-3">
        <div class="card-header"><h3><i class="fas fa-graduation-cap" style="color:var(--primary);margin-right:8px"></i>Academic Details</h3></div>
        <div class="card-body">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Department *</label>
              <select name="department" class="form-control form-select" required>
                {% for d in ['Computer Science & Engineering','Electronics & Communication','Mechanical Engineering','Civil Engineering','Electrical Engineering','Information Technology','Business Administration','Commerce','Pharmacy','Nursing','Law','Arts & Humanities'] %}
                <option {{ 'selected' if student.department == d }}>{{ d }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Course *</label>
              <select name="course" class="form-control form-select" required>
                {% for c in ['B.Tech','M.Tech','BCA','MCA','B.Sc','M.Sc','BBA','MBA','B.Com','M.Com','B.Pharm','M.Pharm','LLB','BA','MA'] %}
                <option {{ 'selected' if student.course == c }}>{{ c }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Year *</label>
              <select name="year" class="form-control form-select" required>
                {% for y in range(1,5) %}<option value="{{ y }}" {{ 'selected' if student.year == y }}>Year {{ y }}</option>{% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Semester *</label>
              <select name="semester" class="form-control form-select" required>
                {% for s in range(1,9) %}<option value="{{ s }}" {{ 'selected' if student.semester == s }}>Semester {{ s }}</option>{% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Section</label>
              <select name="section" class="form-control form-select">
                {% for s in ['A','B','C','D'] %}<option {{ 'selected' if student.section == s }}>{{ s }}</option>{% endfor %}
              </select>
            </div>
          </div>
        </div>
      </div>

      <div style="display:flex;gap:12px;justify-content:flex-end">
        <a href="{{ url_for('admin.view_student', sid=student.id) }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
      </div>
    </div>
  </div>
</form>
{% endblock %}
