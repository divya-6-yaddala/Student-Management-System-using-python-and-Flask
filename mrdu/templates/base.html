<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MRDU Portal{% endblock %} — Mallareddy Deemed University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary: #1a237e;
      --primary-light: #283593;
      --primary-dark: #0d1257;
      --accent: #ff6f00;
      --accent-light: #ff8f00;
      --success: #2e7d32;
      --warning: #e65100;
      --danger: #b71c1c;
      --info: #01579b;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --sidebar-w: 260px;
      --header-h: 64px;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh;
      background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary) 60%, var(--primary-light) 100%);
      overflow-y: auto; z-index: 100; transition: transform .3s ease;
      display: flex; flex-direction: column;
    }
    .sidebar-brand {
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-brand .logo-circle {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-family: 'Sora', sans-serif; font-weight: 700; color: white;
      margin-bottom: 10px;
    }
    .sidebar-brand h2 { color: white; font-size: 15px; font-weight: 700; font-family: 'Sora', sans-serif; line-height: 1.2; }
    .sidebar-brand p { color: rgba(255,255,255,0.5); font-size: 11px; margin-top: 2px; }
    .sidebar nav { flex: 1; padding: 16px 12px; }
    .nav-section { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: rgba(255,255,255,0.3); padding: 14px 10px 6px; text-transform: uppercase; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 10px;
      font-size: 13.5px; font-weight: 500; margin-bottom: 2px; transition: all .2s;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(255,255,255,0.12); color: white;
    }
    .nav-item.active { background: rgba(255,111,0,0.25); color: var(--accent-light); font-weight: 600; }
    .nav-item i { width: 18px; text-align: center; font-size: 14px; }
    .sidebar-footer {
      padding: 16px; border-top: 1px solid rgba(255,255,255,0.1);
    }
    .user-card {
      display: flex; align-items: center; gap: 10px; padding: 10px;
      background: rgba(255,255,255,0.08); border-radius: 10px;
    }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .user-info p { color: white; font-size: 13px; font-weight: 600; line-height: 1.2; }
    .user-info span { color: rgba(255,255,255,0.5); font-size: 11px; }

    /* Main Content */
    .main-wrap { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; height: var(--header-h); background: var(--card);
      border-bottom: 1px solid var(--border); display: flex; align-items: center;
      justify-content: space-between; padding: 0 28px; z-index: 50;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .topbar-left h1 { font-size: 18px; font-weight: 700; color: var(--text); font-family: 'Sora', sans-serif; }
    .topbar-left p { font-size: 12px; color: var(--text-muted); }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .topbar-btn {
      width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
      background: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 14px; text-decoration: none; transition: all .2s;
    }
    .topbar-btn:hover { background: var(--bg); color: var(--primary); }
    .logout-btn {
      display: flex; align-items: center; gap: 6px; padding: 7px 14px;
      background: var(--primary); color: white; border-radius: 8px; text-decoration: none;
      font-size: 13px; font-weight: 600; transition: all .2s;
    }
    .logout-btn:hover { background: var(--primary-dark); }
    .content { flex: 1; padding: 28px; }

    /* Cards */
    .card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      border: 1px solid var(--border); overflow: hidden;
    }
    .card-header {
      padding: 18px 22px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-header h3 { font-size: 15px; font-weight: 700; color: var(--text); }
    .card-body { padding: 22px; }

    /* Stat Cards */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card); border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 14px;
    }
    .stat-icon {
      width: 48px; height: 48px; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    .stat-card h4 { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1; margin-bottom: 4px; }
    .stat-card p { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .ic-blue { background: #e8eaf6; color: var(--primary); }
    .ic-orange { background: #fff3e0; color: var(--accent); }
    .ic-green { background: #e8f5e9; color: var(--success); }
    .ic-red { background: #ffebee; color: var(--danger); }
    .ic-teal { background: #e0f7fa; color: #00838f; }

    /* Tables */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead th { background: #f8f9ff; color: var(--text); font-weight: 700; padding: 12px 14px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); }
    tbody td { padding: 12px 14px; border-bottom: 1px solid #f3f4f6; color: var(--text); vertical-align: middle; }
    tbody tr:hover { background: #fafbff; }
    tbody tr:last-child td { border-bottom: none; }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .badge-success { background: #e8f5e9; color: var(--success); }
    .badge-danger { background: #ffebee; color: var(--danger); }
    .badge-warning { background: #fff8e1; color: #e65100; }
    .badge-info { background: #e3f2fd; color: var(--info); }
    .badge-purple { background: #f3e5f5; color: #7b1fa2; }
    .badge-gray { background: #f3f4f6; color: #6b7280; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px;
      border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
      border: none; text-decoration: none; transition: all .2s; font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-accent { background: var(--accent); color: white; }
    .btn-accent:hover { background: var(--accent-light); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--bg); }
    .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 7px; }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .form-control {
      width: 100%; padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 13.5px; font-family: inherit; color: var(--text); background: white;
      transition: border-color .2s, box-shadow .2s; outline: none;
    }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,35,126,0.08); }
    .form-select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; background-size: 16px; padding-right: 36px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .form-section { background: #f8f9ff; border-radius: 10px; padding: 18px; border: 1px solid #e8eaf6; margin-bottom: 16px; }
    .form-section-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Alerts */
    .flash-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
    .alert {
      padding: 12px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 500;
      display: flex; align-items: flex-start; gap: 10px; box-shadow: var(--shadow-lg);
      animation: slideIn .3s ease; cursor: pointer;
    }
    .alert-success { background: #e8f5e9; color: var(--success); border-left: 4px solid var(--success); }
    .alert-danger { background: #ffebee; color: var(--danger); border-left: 4px solid var(--danger); }
    .alert-info { background: #e3f2fd; color: var(--info); border-left: 4px solid var(--info); }
    .alert-warning { background: #fff8e1; color: #e65100; border-left: 4px solid #e65100; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Progress Bar */
    .progress-bar { height: 8px; background: #e5e7eb; border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 10px; transition: width .5s ease; }

    /* Page Header */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-header h2 { font-size: 22px; font-weight: 800; font-family: 'Sora', sans-serif; }
    .page-header p { font-size: 13px; color: var(--text-muted); }

    /* Grid layouts */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .sidebar { transform: translateX(-100%); }
      .main-wrap { margin-left: 0; }
    }
    .mt-1 { margin-top: 6px; } .mt-2 { margin-top: 12px; } .mt-3 { margin-top: 20px; } .mt-4 { margin-top: 28px; }
    .mb-1 { margin-bottom: 6px; } .mb-2 { margin-bottom: 12px; } .mb-3 { margin-bottom: 20px; }
    .text-muted { color: var(--text-muted); font-size: 12px; }
    .text-right { text-align: right; }
    .flex { display: flex; } .items-center { align-items: center; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; }
    .justify-between { justify-content: space-between; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-container" id="flashContainer">
  {% for cat, msg in messages %}
  <div class="alert alert-{{ cat }}" onclick="this.remove()">
    <i class="fas fa-{% if cat == 'success' %}check-circle{% elif cat == 'danger' %}exclamation-circle{% elif cat == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %}"></i>
    <span>{{ msg }}</span>
  </div>
  {% endfor %}
</div>
<script>
  setTimeout(() => {
    document.querySelectorAll('.alert').forEach(a => a.style.opacity = '0');
    setTimeout(() => document.getElementById('flashContainer')?.remove(), 500);
  }, 5000);
</script>
{% endif %}
{% endwith %}

{% block body %}{% endblock %}

<script>
// Mark active nav item
document.querySelectorAll('.nav-item').forEach(item => {
  if (item.href && window.location.pathname.startsWith(new URL(item.href).pathname)) {
    item.classList.add('active');
  }
});
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
