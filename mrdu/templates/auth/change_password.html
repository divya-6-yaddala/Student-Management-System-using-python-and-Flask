{% extends "base.html" %}
{% block body %}
<div style="min-height:100vh;background:var(--bg,#f0f2f5);display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="width:100%;max-width:420px">
    <div class="card">
      <div style="background:linear-gradient(135deg,var(--primary,#1a237e),#283593);padding:24px;text-align:center;color:white">
        <div style="width:50px;height:50px;background:rgba(255,255,255,0.15);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px"><i class="fas fa-key"></i></div>
        <h2 style="font-size:18px;font-weight:700">Change Password</h2>
        <p style="opacity:0.7;font-size:13px">MRDU Student Portal</p>
      </div>
      <div class="card-body">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}{% for cat, msg in messages %}
            <div style="padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;font-weight:500;background:{% if cat=='success' %}#e8f5e9{% elif cat=='danger' %}#ffebee{% else %}#e3f2fd{% endif %};color:{% if cat=='success' %}#2e7d32{% elif cat=='danger' %}#b71c1c{% else %}#01579b{% endif %}">{{ msg }}</div>
          {% endfor %}{% endif %}
        {% endwith %}
        <form method="POST">
          <div class="form-group"><label class="form-label">Current Password</label><input type="password" name="current_password" class="form-control" required></div>
          <div class="form-group"><label class="form-label">New Password</label><input type="password" name="new_password" class="form-control" required minlength="6"></div>
          <div class="form-group"><label class="form-label">Confirm New Password</label><input type="password" name="confirm_password" class="form-control" required></div>
          <button type="submit" class="btn btn-primary" style="width:100%"><i class="fas fa-save"></i> Update Password</button>
          <a href="{{ url_for('admin.dashboard') if current_user.role=='admin' else url_for('student.dashboard') }}" class="btn btn-outline" style="width:100%;margin-top:10px;justify-content:center">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
<style>:root{--primary:#1a237e;--border:#e5e7eb;--bg:#f0f2f5}</style>
{% endblock %}
